name: MATLAB

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2025b
          cache: true
          products: Statistics_and_Machine_Learning_Toolbox Curve_Fitting_Toolbox

      - name: Install ExampleDrivenTester add-on (File Exchange)
        uses: matlab-actions/run-command@v2
        with:
          command: |
            fileExchangeId = 156374;
            addonReleaseVersion = 0.92;
            installAddOn(fileExchangeId, addonReleaseVersion);

      - name: Check for code issues
        uses: matlab-actions/run-build@v2
        with:
          tasks: check

      - name: Run examples as test
        uses: matlab-actions/run-build@v2
        with:
          tasks: runExample

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-report/
            coverage-report/
