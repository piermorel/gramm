# This workflow was generated using the GitHub Actions Workflow Generator for MATLAB.
# See https://matlab-actions.github.io/workflow-generator

name: MATLAB

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      
      # Set up MATLAB and other MathWorks products on the runner.
      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: latest
          cache: true
          # Set up additional products using the products input.
          # See https://github.com/matlab-actions/setup-matlab/#set-up-matlab
          products: Statistics_and_Machine_Learning_Toolbox Curve_Fitting_Toolbox

      - name: Install ExampleDrivenTester add-on (File Exchange)
        uses: matlab-actions/run-command@v2
        with:
          command: |
            fileExchangeId = 156374;
            addonReleaseVersion = 0.92;

            urlGen = matlab.addons.repositories.FileExchangeRepositoryUrlGenerator;
            url = urlGen.addonPackagesUrl(fileExchangeId, addonReleaseVersion);
            pkgMetadata = webread(url);

            isMltbx = arrayfun(@(p) strcmp(p.type,'mltbx'), pkgMetadata.packages);
            mltbxMetadata = pkgMetadata.packages(find(isMltbx,1));

            if isempty(mltbxMetadata)
                error("No mltbx package found.");
            end

            outFile = fullfile(tempdir, mltbxMetadata.filename);
            websave(outFile, mltbxMetadata.url);

            matlab.addons.install(outFile);
            rehash toolboxcache;

            disp("Installed toolbox from " + mltbxMetadata.url);
            
      # Run tests authored using the MATLAB unit testing framework or Simulink Test.
      #- name: Run MATLAB tests
      #  uses: matlab-actions/run-tests@v2
        # If you are not using a MATLAB project, add your source code to the path using the source-folder input.
        # with:
        #   source-folder: myfolderA; myfolderB

      # Alternatively, run tasks from your buildfile.m.
      - name: Run MATLAB build
        uses: matlab-actions/run-build@v2
      #   with:
      #     tasks: test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            testresults.html
            coverageresults.html
            release/

