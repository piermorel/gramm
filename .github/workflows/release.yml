# Release workflow - creates GitHub releases with toolbox binaries
# Triggered when you push a version tag (e.g., v3.0.2)

name: Release

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v3.0.2

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2025b
          cache: true
          products: Statistics_and_Machine_Learning_Toolbox Curve_Fitting_Toolbox

      - name: Install ExampleDrivenTester add-on (File Exchange)
        uses: matlab-actions/run-command@v2
        with:
          command: |
            fileExchangeId = 156374;
            addonReleaseVersion = 0.92;
            installAddOn(fileExchangeId, addonReleaseVersion);

      - name: Check for code issues
        uses: matlab-actions/run-build@v2
        with:
          tasks: check

      - name: Run examples as test
        uses: matlab-actions/run-build@v2
        with:
          tasks: runExample

      - name: Publish the documents
        uses: matlab-actions/run-build@v2
        with:
          tasks: publish

      - name: Package toolbox
        uses: matlab-actions/run-build@v2
        env:
          CI_COMMIT_TAG: ${{ github.ref_name }}
        with:
          tasks: package

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: gramm*.mltbx
          draft: true
          generate_release_notes: true
